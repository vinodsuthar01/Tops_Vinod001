{% extends 'base.html' %}

{% block content %}

<div class="card">
    <h3 align="center">Edit Comment</h3>

    <div class="form-container">
        <div class="form-card">
            <form  method="POST">
                {% csrf_token %}
                <textarea name="content">{{ comment.content }}</textarea><br><br>
                <button class="btn">Update</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
