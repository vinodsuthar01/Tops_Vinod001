{% extends 'base.html' %}

{% block title %} Home Page {% endblock %}

{% block content %}

{% for post in posts %}
    <div class="card">
        <h3>{{ post.title }}</h3>
        <p>{{ post.content|truncatewords:20 }}</p>
        <a class="btn" href="{% url 'detail' post.id %}">Read More</a>
    </div>
{% empty %}
    <p>No posts available</p>
{% endfor %}

{% endblock %}
