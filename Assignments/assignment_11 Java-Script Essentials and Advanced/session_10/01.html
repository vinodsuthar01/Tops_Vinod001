<!DOCTYPE html>

<head><title>Q1</title></head>
<body>
<!-- Q1: Function returns welcome message using template literals -->
<script>
  function formatWelcomeMessage(userName, followers) {
    return `Hello ${userName}, you have ${followers} followers!`;
  }
  console.log(formatWelcomeMessage("Vinod", 1200));
</script>
</body>
