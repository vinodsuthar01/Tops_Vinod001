<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Select an existing <h2> element with the id 'offer' and use JavaScript to change its text to 'Flat 50% Off on Zomato Today!' and set its color to red using the style property.<br><br><em><strong>Hint:</strong> Use getElementById to select and .style.color to update the color.</em>
 -->
        <h2 id="offer"></h2>
        <script>
            let offer = document.getElementById("offer");
            offer.style.backgroundColor = "red";
            offer.innerText = "Flat 50% Off on Zomato Today!"
        </script>
</body>
</html>
