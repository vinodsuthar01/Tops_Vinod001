<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #moodbox{
            display: flex;
            padding: 20px;
            background-color: antiquewhite;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        #moodbox input{
           
            padding: 10px;
            background-color: white;
            font-size: larger;
            border: none;
            border-radius: 10px;
            color:black;
            text-align: center;
           
        }

        #moodbox button{
            padding: 10px;
            background-color: rgb(29, 198, 17);
            border: none;
            border-radius: 10px;
            color: rgb(0, 0, 0);
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <!-- Create a function that updates the background color of a <div id="moodbox"></div> in real-time as the user types a color name (like 'pink' or 'yellow') into an input box.<br><br><em><strong>Hint:</strong> Listen for the input event and use .style.backgroundColor.</em>
 -->
    <div id="moodbox">
        <input id="colorName" type="text">
        <button onclick="changeColor()">change color</button>
    </div>
    
    <script>
        function changeColor(){
            let div = document.getElementById("moodbox");
            let colorName = document.getElementById("colorName").value;
            div.style.backgroundColor = colorName;
        }
    </script>
</body>
</html>
