<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Create an HTML page with a <div id="greeting"></div> and use getElementById in your script to set its innerHTML to 'Welcome to the IPL Fan Zone!'.
 -->

    <div id="greeting"></div>
    <script>
        let greet = document.getElementById("greeting");
        greet.innerHTML = "Welcome to the IPL Fan Zone!"
    </script>
</body>
</html>
