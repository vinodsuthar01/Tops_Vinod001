<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .dark{
            display: fixed;
            background-color: black;
            color: white;
            text-align: center;
            padding: 25% ;
             }

        .light{
            display: fixed;
            text-align: center;
            background-color: white;
            color: black;
            padding: 25%;
        }

        .theme-btn-light{
            
            padding: 1em;
            border-radius: 1em;
            background-color: black;
            color: white;
            border: none;
        }

        .theme-btn-dark{
            padding: 1em;
            border-radius: 1em;
            background-color: white;
            color: black;
            border: none;
        }
    </style>
</head>
<body class="light">
    <!-- Create a 'Dark Mode' toggle button that, when clicked, uses getElementById to change the
      background color of the page and updates the button text to 'Light Mode'.<br><br><em>
        <strong>Hint:</strong> Use the style property to change document.body's background 
        color.</em> -->

    <button id="theme-btn" class="theme-btn-light" onclick="changeTheme()">Dark Mode</button>

    <script>
        idx = 0;
        function changeTheme(){
            if(idx%2==0){
                document.body.classList.add('dark');
                document.body.classList.remove('light');
                let btn = document.getElementById("theme-btn");
                btn.innerText = "light mode"
                btn.classList.add("theme-btn-dark");
                btn.classList.remove('theme-btn-light');
                
                
            }
            else{
                document.body.classList.add('light');
                document.body.classList.remove('dark');
                let btn = document.getElementById("theme-btn");
                btn.classList.add("theme-btn-light");
                btn.classList.remove('theme-btn-dark');
                btn.innerText = "dark mode"
            }

            idx ++;
        }
    </script>
</body>
</html>
