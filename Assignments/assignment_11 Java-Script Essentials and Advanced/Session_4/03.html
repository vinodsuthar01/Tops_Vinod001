<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Given an array of cricket team names for IPL, use a while loop to print each team name in uppercase.
 -->
    <script>
        const iplCricketers = [
            "virat kohli",
            "ms dhoni",
            "rohit rharma",
            "david warner",
            "andre russell"
        ];
        let i = 0;
        while (i < iplCricketers.length) {
            console.log(iplCricketers[i].toUpperCase());
            i++;
        }
    </script>
</body>

</html>
