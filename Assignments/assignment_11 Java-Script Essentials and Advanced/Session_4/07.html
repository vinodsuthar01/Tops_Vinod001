<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <!-- Given an array of objects representing Flipkart products (each with name and price), use a for-of loop to print only the product names.
 -->
    <script>
        const flipkartProducts = [
            { name: "Smartphone", price: 15000 },
            { name: "Laptop", price: 55000 },
            { name: "Headphones", price: 2000 },
            { name: "Smartwatch", price: 7000 },
            { name: "Shoes", price: 2500 }
        ];

        for (const product of flipkartProducts) {
            console.log(product.name);
        }

    </script>
</body>

</html>
