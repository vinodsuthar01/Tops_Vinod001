<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Use a do-while loop to simulate a Zomato order tracker that prints 'Order status: Preparing', 'Order status: Out for delivery', and 'Order status: Delivered' in sequence, stopping after the last status.
 -->
    <script>
        const orderStatuses = [
            "Preparing",
            "Out for delivery",
            "Delivered"
        ];

        let i = 0;

        do {
            console.log("Order status: " + orderStatuses[i]);
            i++;
        } while (i < orderStatuses.length);
    </script>
</body>

</html>
