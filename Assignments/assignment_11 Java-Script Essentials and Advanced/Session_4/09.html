<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Create an array of your 5 most-used WhatsApp contacts (just names as strings). Use the forEach method to print a message for each: 'Sending hi to [name] on WhatsApp!'.<br><br><em><strong>Hint:</strong> Use an arrow function as the callback for forEach.</em>
 -->

    <script>
        const whatsappContacts = [
            "Rahul",
            "Sneha",
            "Amit",
            "Priya",
            "Karan"
        ];

        whatsappContacts.forEach(contact => {
            console.log(`Sending hi to ${contact} on WhatsApp!`);
        });

    </script>
</body>

</html>
