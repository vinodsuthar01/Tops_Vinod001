<body>
    <!-- Create an array called favApps with the names of 5 apps you use daily 
     (like Instagram, Zomato, Paytm, etc.) and use a for loop to print each app name 
     in the console.
    -->
    <script>
        let favApps = ["Instagram","Youtube","Zomato","Paytm","google"];
        
        
        for(let i=0;i<favApps.length;i++){
            console.log(favApps[i]);
            
        }
    </script>
</body>
