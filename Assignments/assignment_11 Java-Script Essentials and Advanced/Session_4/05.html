<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Create an array called playlist with 4 song names (strings). Use a do-while loop to print each song name along with its index (e.g., '0: Kesariya') in the console.
 -->
    <script>
        const playlist = [
            "Kesariya",
            "Tum Hi Ho",
            "Tera Fitoor",
            "Jeene Laga Hoon"
        ];

        let i = 0;

        do {
            console.log(i + ": " + playlist[i]);
            i++;
        } while (i < playlist.length);

    </script>
</body>

</html>
