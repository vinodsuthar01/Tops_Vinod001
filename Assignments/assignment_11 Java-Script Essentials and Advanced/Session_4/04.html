<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Given an array of Instagram usernames, use a while loop to print each username in uppercase.
 -->
    <script>
        const instagramUsernames = [
            "vinod_coder",
            "travel_with_me",
            "foodie_life",
            "music_vibes",
            "tech_guru"
        ];

        let i = 0;

        while (i < instagramUsernames.length) {
            console.log(instagramUsernames[i].toUpperCase());
            i++;
        }
    </script>
</body>

</html>
