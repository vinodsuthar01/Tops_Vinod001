<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Use the forEach method to loop through an array of cricket team names (e.g., 'MI', 'CSK', 'RCB', 'GT') and print 'Go [team]!' for each.<br><br><em><strong>Hint:</strong> forEach takes a callback function with the current element as a parameter.</em>
 -->
    <script>

        const cricketTeams = ["MI", "CSK", "RCB", "GT"];

        cricketTeams.forEach(team => {
            console.log(`Go ${team}!`);
        });

    </script>
</body>

</html>
