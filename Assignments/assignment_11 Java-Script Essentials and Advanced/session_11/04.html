<body>
<!-- Q6: Simulate fetching song lyrics -->
<script>
  function fetchSongLyrics(song, callback) {
    setTimeout(() => {
      callback(`Lyrics for ${song}: La la la...`);
    }, 1500);
  }
  fetchSongLyrics("Tera Fitoor", lyrics => console.log(lyrics));
</script>
</body>
