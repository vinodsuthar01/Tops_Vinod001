<!DOCTYPE html>
<html>
<head><title>Q4</title></head>
<body>
<!-- Q4: placeOrder function with callback -->
<script>
  function placeOrder(item, callback) {
    setTimeout(() => {
      callback(`Your ${item} is being prepared`);
    }, 1000);
  }
  placeOrder("Pizza", message => console.log(message));
</script>
</body>
</html>
