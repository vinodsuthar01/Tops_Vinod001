<!DOCTYPE html>
<html>
<head><title>Q9</title></head>
<body>
<!-- Q9: Promise resolves/rejects based on orderId -->
<script>
  function getOrderStatus(orderId) {
    return new Promise((resolve, reject) => {
      setTimeout(() => {
        if(orderId % 2 === 0) resolve("Order delivered");
        else reject("Order not found");
      }, 1500);
    });
  }
  getOrderStatus(2)
    .then(msg => console.log(msg))
    .catch(err => console.log(err));
  getOrderStatus(3)
    .then(msg => console.log(msg))
    .catch(err => console.log(err));
</script>
</body>
</html>
