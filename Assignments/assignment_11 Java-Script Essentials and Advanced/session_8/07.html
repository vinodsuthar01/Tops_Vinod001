<!-- Given an array of objects called movies, where each object has properties: title, year, and a nested object rating with keys imdb and rottenTomatoes, write code to print each movie's title and its IMDb rating.
 -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const movies = [
            { title: "Inception", year: 2010, rating: { imdb: 8.8, rottenTomatoes: 87 } },
            { title: "Interstellar", year: 2014, rating: { imdb: 8.6, rottenTomatoes: 72 } },
            { title: "The Dark Knight", year: 2008, rating: { imdb: 9.0, rottenTomatoes: 94 } }
        ];

        movies.forEach(movie => {
            console.log(`${movie.title} - IMDb: ${movie.rating.imdb}`);
        });

    </script>
</body>

</html>
