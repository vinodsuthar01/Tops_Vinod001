<!-- Add a new playlist object to your playlists array using the push() method. 
 The new playlist should have a unique name, creator, and numberOfSongs. Print 
 the updated array.
 -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        const playlists = [
            { name: "Top Hits", creator: "Alice", numberOfSongs: 20 },
            { name: "Workout Mix", creator: "Bob", numberOfSongs: 15 },
            { name: "Chill Vibes", creator: "Charlie", numberOfSongs: 25 }
        ];
        playlists.push({ name: "Party Mix", creator: "Dave", numberOfSongs: 30 });
        console.log(playlists);

    </script>
</body>

</html>
