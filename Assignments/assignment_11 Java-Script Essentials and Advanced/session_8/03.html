<!-- Use the push() method to add a new playlist object to your playlists array with your favorite genre. Then, use pop() to remove the last playlist and log the updated array after each operation.
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        playlists.push({ name: "Rock Legends", creator: "Eve", numberOfSongs: 40, genre: "Rock" });
        console.log("After push:", playlists);

        playlists.pop();
        console.log("After pop:", playlists);

    </script> 
</body>
</html>
