<!-- Q9: Function reads recentSearches from localStorage -->
<script>
  function getRecentSearches(){
    const saved=localStorage.getItem("recentSearches");
    return saved?JSON.parse(saved):[];
  }
  console.log(getRecentSearches());
</script>
