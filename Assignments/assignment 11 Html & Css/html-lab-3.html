<!DOCTYPE html>
<html>
<head>
    <title>Product Catalog</title>
</head>
<body>

<h1>Product Catalog</h1>

<table border="1" style="border-collapse: collapse; width:100%; text-align:center;">

    <thead style="background-color: lightgray;">
        <tr>
            <th>Product Name</th>
            <th>Product Image</th>
            <th>Price</th>
            <th>Description</th>
            <th>Availability</th>
        </tr>
    </thead>

    <tbody>

        <tr>
            <td>Laptop</td>
            <td>
                <img src="images/leptop-img.avif"
                     alt="Laptop">
            </td>
            <td>₹50,000</td>
            <td>High performance laptop</td>
            <td>In Stock</td>
        </tr>

        <tr>
            <td>Mobile</td>
            <td>
                <img src="images/mobile-img.jpg"
                     alt="Mobile">
            </td>
            <td>₹20,000</td>
            <td rowspan="2">
                Electronics Product
            </td>
            <td>Out of Stock</td>
        </tr>

        <tr>
            <td>Tablet</td>
            <td>
                <img src="images/teblet-img.jpg"
                     alt="Tablet">
            </td>
            <td>₹15,000</td>
            <td>In Stock</td>
        </tr>

        <tr>
            <td colspan="5">
                End of Product List
            </td>
        </tr>

    </tbody>

</table>

</body>
</html>
