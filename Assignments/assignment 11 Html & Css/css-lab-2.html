<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            background:#eee;
        }

        .card{
            width:300px;
            margin:50px auto;
            padding:20px;
            border:2px solid black;
            text-align:center;
            box-sizing:border-box;
            background:white;
        }

        img{
            width:150px;
            border:3px solid gray;
            padding:5px;
            box-sizing:content-box;
        }

        button{
            padding:10px 20px;
            margin-top:10px;
        }
    </style>
</head>
<body>

<div class="card">

    <img src="images/profile-img.jpg" alt="Profile">

    <h2>Vinod</h2>

    <p>Frontend Developer</p>

    <button>Follow</button>

</div>

</body>
</html>
