<!-- templates/login.html -->
{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg, #4facfe, #00f2fe);
    margin: 0;
    padding: 0;
}

h2 {
    text-align: center;
    color: #333;
}

form {
    width: 300px;
    margin: 80px auto;
    padding: 25px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    text-align: center;
}

input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #4facfe;
    box-shadow: 0 0 5px #4facfe;
}

button {
    width: 95%;
    padding: 10px;
    background: #4facfe;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #007bff;
}

a {
    display: block;
    text-align: center;
    margin-top: 15px;
    color: #007bff;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

p, .error {
    color: red;
    text-align: center;
}
</style>
<h2>Login</h2>
{{error}}
<form method="POST">
    {% csrf_token %}
    <input type="text" name="uname" placeholder="Username"><br>
    <input type="password" name="password" placeholder="Password"><br>

    <button type="submit">Login</button>
</form>
<a href="{% url 'signup' %}">don't have a account</a>
<a href="{% url 'home_page' %}">go to home</a>
{% endblock %}
