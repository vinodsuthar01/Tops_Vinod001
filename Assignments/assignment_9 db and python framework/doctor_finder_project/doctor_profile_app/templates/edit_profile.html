{% extends 'base.html'  %}

{% block title %} Edit Profile {% endblock %}

{% block content %}
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

.form-container {
    width: 350px;
    margin: 50px auto;
    padding: 25px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.form-container h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
}

.form-group {
    margin-bottom: 15px;
}

.form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    transition: 0.3s;
}

.form-group input:focus {
    border-color: #007bff;
    box-shadow: 0 0 5px rgba(0,123,255,0.3);
}

.file-input label {
    font-size: 14px;
    color: #555;
    display: block;
    margin-bottom: 5px;
}

button {
    width: 100%;
    padding: 10px;
    background: #007bff;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0056b3;

}</style>




<form method="POST" enctype="multipart/form-data" class="form-container">
    {% csrf_token %}

    <h2>Doctor Profile</h2>

    <div class="form-group">
        <input type="number" name="phone" placeholder="Phone Number" value="{{doctor.phone}}" required>
    </div>

    <div class="form-group">
        <input type="number" name="experience" placeholder="Years of Experience" value="{{doctor.experience}}" required>
    </div>

    <div class="form-group">
        <input type="text" name="clinic_address" placeholder="Clinic Address" value="{{doctor.clinic_address}}" required>
    </div>

    <div class="form-group">
        <input type="text" name="specialization" placeholder="Specialization" value="{{doctor.specialization}}" required>
    </div>

    <div class="form-group file-input">
        <label>Upload Profile Image</label>
        <input type="file" name="image">
    </div>

    <button type="submit">Save Profile</button>

</form>
<br> <br>
<a href="{% url 'profile_page' doctor.id %}">Go Back </a> 


{% endblock %}
